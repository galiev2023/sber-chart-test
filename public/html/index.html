<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title></title>
    <link rel="stylesheet" href="/css/normalize.css">
    <link rel="stylesheet" href="/css/fonts.css">
    <link rel="stylesheet" href="/css/styles.css">
  </head>
  <body>
    <div class="modal-backdrop" id="modalBackdrop">
      <div class="modal" id="customModal">
        <div class="modal-content"><span class="close-btn modal-close">&times;</span>
          <div class="modal-header">
            <div class="modal-header-text">Внимание</div>
          </div>
          <div class="modal-body">Вы выходите из авторизованного профиля, вы будете перенаправлены на страницу авторизации.</div>
          <div class="modal-footer">
            <button class="btn-std modal-close">Отмена</button>
            <button class="btn-red" id="logout">Выйти</button>
          </div>
        </div>
      </div>
    </div>
    <div class="menu-top">
      <div class="menu-container">
        <div class="menu-logo"><img src="/img/logo.png" alt=""></div>
        <div class="menu-login">
        </div>
      </div>
    </div>
    <div class="container bgr">
      <div class="login-panel">
        <h2>Войти в панель</h2>
        <form id="loginForm" method="POST" action="/login">
          <div class="form-group">
            <input id="login" type="text" name="login" placeholder=" " required>
            <label for="login">Логин</label>
          </div>
          <div class="form-group">
            <input id="password" type="password" name="password" placeholder=" " required>
            <label for="password">Пароль</label>
          </div>
          <div class="status">Логин или пароль неверны.</div>
          <button class="btn-green" id="loginButton" type="submit"><span class="spinner" aria-hidden="true"></span><span class="login-btn-text">Войти</span></button>
        </form>
      </div>
    </div>
    <script src="/js/auth.js" defer></script>
    <script src="/js/modal.js"></script>
    <script src="/js/logout.js"></script>
  </body>
</html>
